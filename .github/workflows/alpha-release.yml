name: Explicit alpha prerelease
run-name: Publish alpha v${{ inputs.version }} by @${{ github.actor }}

# Alpha publication is explicitly permitted without native Foundry acceptance.
# The independent stable-release workflow and its gates remain unchanged.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing x.y.z-alpha.N tag; manifest must match exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: astra-alpha-release
  cancel-in-progress: false

jobs:
  verify-build:
    if: github.repository == 'horusian161-code/astra-foundry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - name: Resolve an existing alpha tag; never create a tag
        id: ref
        uses: actions/github-script@v7
        env:
          ASTRA_VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.ASTRA_VERSION;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-alpha\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('Only x.y.z-alpha.N versions are accepted by the alpha workflow.');
            }
            const tag = `v${version}`;
            let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) {
              throw new Error('The existing alpha tag must resolve to one commit.');
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('commit', object.sha);
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact alpha manifest and checked tag commit
        env:
          ASTRA_VERSION: ${{ steps.ref.outputs.version }}
          ASTRA_TAG: ${{ steps.ref.outputs.tag }}
          ASTRA_COMMIT: ${{ steps.ref.outputs.commit }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ASTRA_COMMIT"
          test "$(git rev-parse "refs/tags/$ASTRA_TAG^{commit}")" = "$ASTRA_COMMIT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const module = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.ASTRA_VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-alpha\.(0|[1-9]\d*)$/);
          assert.equal(module.id, 'astra-redline-combat');
          assert.equal(module.version, version);
          assert.equal(pkg.version, version);
          assert.equal(process.env.ASTRA_TAG, `v${version}`);
          assert.equal(module.compatibility.minimum, '12');
          assert.equal(module.compatibility.maximum, '12.999');
          assert.equal(Object.hasOwn(module.compatibility, 'verified'), false);
          assert.deepEqual(module.relationships?.requires ?? [], []);
          assert.deepEqual(module.dependencies ?? [], []);
          const base = `https://github.com/horusian161-code/astra-foundry/releases/download/v${version}`;
          assert.equal(module.manifest, `${base}/module.json`);
          assert.equal(module.download, `${base}/astra-redline-combat-${version}.zip`);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build one Foundry runtime ZIP
        run: python3 tools/build.py
      - name: Verify build metadata, checkout files, ZIP contents, and checksum
        env:
          ASTRA_VERSION: ${{ steps.ref.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.')
          module = json.loads((root / 'module.json').read_text())
          build = json.loads((root / 'dist/build-manifest.json').read_text())
          version = os.environ['ASTRA_VERSION']
          name = f'astra-redline-combat-{version}.zip'
          archive = root / 'dist' / name
          digest = lambda data: hashlib.sha256(data).hexdigest()
          data = archive.read_bytes()
          assert build['format'] == 'astra-runtime-build-v1'
          assert build['moduleId'] == module['id'] == 'astra-redline-combat'
          assert build['version'] == module['version'] == version
          assert build['fingerprintAlgorithm'] == 'sha256-runtime-path-index-v1'
          assert build['archive'] == {'path': f'dist/{name}', 'sha256': digest(data), 'bytes': len(data)}
          assert archive.with_suffix('.sha256').read_text().strip() == f'{digest(data)}  {name}'
          expected = ['module.json', 'LICENSE', 'README.md']
          for directory in ('scripts', 'styles', 'templates'):
              expected += [p.as_posix() for p in (root / directory).rglob('*') if p.is_file()]
          expected.sort(key=lambda path: path.encode('utf-8'))
          assert [entry['path'] for entry in build['files']] == expected
          index = ''.join(f"{entry['path']}\0{entry['sha256']}\n" for entry in build['files'])
          assert build['sourceFingerprint'] == digest(index.encode('utf-8'))
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              assert sorted(package.namelist()) == sorted(f"{module['id']}/{path}" for path in expected)
              for entry in build['files']:
                  current = (root / entry['path']).read_bytes()
                  assert digest(current) == entry['sha256'] and len(current) == entry['bytes']
                  assert package.read(f"{module['id']}/{entry['path']}") == current
          PY
      - name: Preserve this run's single alpha runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-candidate-${{ github.run_id }}
          path: |
            dist/astra-redline-combat-${{ steps.ref.outputs.version }}.zip
            dist/astra-redline-combat-${{ steps.ref.outputs.version }}.sha256
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-alpha:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      ASTRA_VERSION: ${{ needs.verify-build.outputs.version }}
      ASTRA_TAG: ${{ needs.verify-build.outputs.tag }}
      ASTRA_COMMIT: ${{ needs.verify-build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify-build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: alpha-candidate-${{ github.run_id }}
          path: dist
      - name: Bind the artifact to the exact checked alpha version
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ASTRA_COMMIT"
          test "$(git rev-parse "refs/tags/$ASTRA_TAG^{commit}")" = "$ASTRA_COMMIT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const module = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const build = JSON.parse(fs.readFileSync('dist/build-manifest.json', 'utf8'));
          const version = process.env.ASTRA_VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-alpha\.(0|[1-9]\d*)$/);
          const name = `astra-redline-combat-${version}.zip`;
          const bytes = fs.readFileSync(`dist/${name}`);
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          assert.equal(module.id, 'astra-redline-combat');
          assert.equal(module.version, version);
          assert.equal(module.compatibility.minimum, '12');
          assert.equal(module.compatibility.maximum, '12.999');
          assert.equal(Object.hasOwn(module.compatibility, 'verified'), false);
          assert.deepEqual(module.relationships?.requires ?? [], []);
          assert.deepEqual(module.dependencies ?? [], []);
          const base = `https://github.com/horusian161-code/astra-foundry/releases/download/v${version}`;
          assert.equal(module.manifest, `${base}/module.json`);
          assert.equal(module.download, `${base}/${name}`);
          assert.equal(build.format, 'astra-runtime-build-v1');
          assert.equal(build.moduleId, module.id);
          assert.equal(build.version, version);
          assert.equal(build.fingerprintAlgorithm, 'sha256-runtime-path-index-v1');
          assert.match(build.sourceFingerprint, /^[a-f0-9]{64}$/);
          assert.deepEqual(build.archive, { path: `dist/${name}`, sha256: digest, bytes: bytes.length });
          assert.equal(fs.readFileSync(`dist/${name.replace(/\.zip$/, '.sha256')}`, 'utf8').trim(), `${digest}  ${name}`);
          NODE
      - name: Publish an explicit prerelease, without claiming native acceptance
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.ASTRA_VERSION;
            const tag = process.env.ASTRA_TAG;
            const commit = process.env.ASTRA_COMMIT;
            let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== commit) throw new Error('The existing alpha tag moved or was removed.');
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              throw new Error('A release already exists for this tag; overwriting is forbidden.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const assets = [
              ['module.json', 'module.json', 'application/json'],
              [`dist/astra-redline-combat-${version}.zip`, `astra-redline-combat-${version}.zip`, 'application/zip'],
              [`dist/astra-redline-combat-${version}.sha256`, `astra-redline-combat-${version}.sha256`, 'text/plain'],
              ['dist/build-manifest.json', 'build-manifest.json', 'application/json'],
            ].map(([path, name, contentType]) => ({ name, contentType, data: fs.readFileSync(path) }));
            const draft = (await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: commit,
              name: `REDLINE COMBAT ${version}`, draft: true, prerelease: true, make_latest: 'false',
              body: [
                'ALPHA PRERELEASE — local tests and runtime package integrity checks passed.',
                'Native Foundry v12 acceptance and live multiplayer checks have NOT been completed.',
                'This is an experimental module for an isolated test world, not a stable or fully ready release.',
                'Astra SDK components are bundled inside this single module; no separate SDK package is required.',
              ].join('\n\n'),
            })).data;
            try {
              for (const asset of assets) {
                await github.rest.repos.uploadReleaseAsset({
                  ...context.repo, release_id: draft.id, name: asset.name,
                  headers: { 'content-type': asset.contentType, 'content-length': asset.data.length },
                  data: asset.data,
                });
              }
              await github.rest.repos.updateRelease({ ...context.repo, release_id: draft.id, draft: false, prerelease: true, make_latest: 'false' });
            } catch (error) {
              try {
                const current = (await github.rest.repos.getRelease({ ...context.repo, release_id: draft.id })).data;
                if (current.draft === true) await github.rest.repos.deleteRelease({ ...context.repo, release_id: draft.id });
                else core.warning('The prerelease is already public; leaving it for manual inspection.');
              } catch (cleanupError) { core.warning(`Draft cleanup failed: ${cleanupError.message}`); }
              throw error;
            }
